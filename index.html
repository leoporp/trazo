<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trazo</title>
<meta name="theme-color" content="#ECE8E1">
<link rel="preload" href="fonts/oswald-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>
<style>
@font-face{font-family:'Oswald';font-weight:500;font-display:swap;src:url(fonts/oswald-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-weight:600;font-display:swap;src:url(fonts/oswald-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:400;font-display:swap;src:url(fonts/archivo-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:600;font-display:swap;src:url(fonts/archivo-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:700;font-display:swap;src:url(fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
/* Layout: una columna de teléfono (máx. 480px), barra inferior fija, pantallas completas para la sesión y hojas desde abajo para editar. */
:root{
  --bg:#ECE8E1; --surface:#F6F3EE; --ink:#1E1D1B; --muted:#6F6A62; --faint:#A39C91;
  --rule:#D6D0C6; --line:#DAD4CA; --accent:#3E5C7A; --accent-ink:#F6F3EE;
  --seg1:#C9C2B6; --seg2:#8C857A; --chip:#E0DBD2; --btn:#1E1D1B; --btn-ink:#ECE8E1; --warn:#9A5A2C;
  --display:'Oswald','Arial Narrow',sans-serif; --body:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --surface:#21201E; --ink:#ECE8E1; --muted:#A39C91; --faint:#6E685F;
  --rule:#2E2C29; --line:#262522; --accent:#93AECA; --accent-ink:#171716;
  --seg1:#3A3834; --seg2:#7A746B; --chip:#2A2825; --btn:#ECE8E1; --btn-ink:#171716; --warn:#D49A6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --surface:#21201E; --ink:#ECE8E1; --muted:#A39C91; --faint:#6E685F;
  --rule:#2E2C29; --line:#262522; --accent:#93AECA; --accent-ink:#171716;
  --seg1:#3A3834; --seg2:#7A746B; --chip:#2A2825; --btn:#ECE8E1; --btn-ink:#171716; --warn:#D49A6A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:480px;margin:0 auto;padding:0 20px 120px;position:relative;min-height:100%}
.bgcurves{position:absolute;inset:0 0 auto 0;width:100%;height:300px;pointer-events:none;overflow:hidden}
.bgcurves path{stroke:var(--line);stroke-width:1.5;fill:none}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:20px;position:relative}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.04em}
.brand svg path{stroke:var(--accent)}
.pill{display:flex;align-items:center;gap:6px;border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px}
.pill b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent)}
h1.big{margin:0;font-family:var(--display);font-weight:600;font-size:54px;line-height:.95;text-transform:uppercase;text-wrap:balance}
h1.big em{font-style:normal;color:var(--accent)}
h2.sec{margin:0;font-family:var(--display);font-weight:600;font-size:30px;text-transform:uppercase;line-height:1}
.quip{margin:0;color:var(--muted);line-height:1.45;max-width:36ch}
.stack{display:flex;flex-direction:column;gap:20px;position:relative;padding-top:20px}
.blocks{display:flex;flex-direction:column}
.blk{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.blk .n{font-family:var(--mono);font-size:13px;color:var(--faint);width:22px;padding-top:2px}
.blk .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.blk .t b{font-size:17px}
.blk .t span{font-size:13px;color:var(--muted)}
.blk .m{font-family:var(--mono);font-size:13px;color:var(--muted)}
.cta{height:60px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;padding:0 24px;width:100%}
.cta svg{stroke:var(--btn-ink)}
.cta.accent{background:var(--accent);color:var(--accent-ink)}
.cta.accent svg{stroke:var(--accent-ink)}
.ghostbtn{height:48px;border-radius:999px;border:1.5px solid var(--rule);font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.done{color:var(--accent)}
.card{background:var(--surface);border-radius:18px;padding:14px 16px}
.stat{font-family:var(--display);font-weight:500;font-size:30px;line-height:1}
.stat small{font-size:15px}
.delta{font-size:12px;color:var(--accent)}
.empty{border:1.5px dashed var(--rule);border-radius:18px;padding:18px;color:var(--muted);line-height:1.45}
.empty b{color:var(--ink)}
/* barra inferior */
.hoyfoot{position:fixed;left:0;right:0;bottom:calc(65px + env(safe-area-inset-bottom,0px));z-index:4;padding:14px 20px 10px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.hoyfoot>div{max-width:440px;margin:0 auto}
.wrap.hasfoot{padding-bottom:200px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--rule);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--faint);min-height:48px}
.nav button svg{stroke:currentColor}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:var(--accent)}
/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-weight:700}
.row .t span{font-size:13px;color:var(--muted)}
.row svg.chev{stroke:var(--faint);flex:none}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);flex:none}
.tag.warn{color:var(--warn)}
.tag.next{background:var(--accent);color:var(--accent-ink)}
/* pantallas completas y hojas */
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.ov .in{max-width:480px;margin:0 auto;padding:16px 20px calc(250px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;gap:16px;position:relative}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 4px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{stroke:var(--ink)}
.iconbtn svg[stroke="currentColor"]{stroke:currentColor}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface);padding:0 12px;width:100%}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
/* sesión */
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .sp{flex:1;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.shead .sp b{font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.bseg button{position:relative;overflow:hidden;background:var(--surface);border-radius:14px;padding:10px 6px 13px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.bseg button span{font-family:var(--display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);line-height:1}
.bseg button small{font-family:var(--mono);font-size:11px;color:var(--faint)}
.bseg button i{position:absolute;left:0;bottom:0;height:4px;background:var(--bc)}
.bseg button u{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--bc);opacity:.25;text-decoration:none}
.bseg button.on{background:var(--ink)}
.bseg button.on span{color:var(--bg)}
.bseg button.on small{color:var(--bg);opacity:.7}
.exr{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.exr button{flex:none;height:34px;padding:0 11px 0 8px;border-radius:9px;border:1.5px solid var(--rule);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;max-width:220px}
.exr button .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.exr button em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exr button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.exr button.on .n{color:var(--ink)}
.exr button.done{color:var(--accent);border-color:transparent;background:var(--surface)}
.exr button.done .n{color:var(--accent)}
.blabel{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muted)}
.blabel i{width:18px;height:4px;border-radius:2px;background:var(--bc)}
.howbtn{align-self:flex-start;font-size:14px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;min-height:36px}
.howbtn svg{stroke:currentColor;transition:transform .2s}
.howbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.how{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}
.how ol li::marker{font-family:var(--mono);font-size:12px;color:var(--accent)}
.how p{margin:0;font-size:13px;line-height:1.4;color:var(--warn)}

.dots{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--seg1)}
.dots i.d{background:var(--accent)}
.dots i.c{background:var(--ink)}
.silbox{background:var(--surface);border-radius:24px;height:min(230px,27vh);min-height:150px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.silbox svg.sil{width:100%;max-width:330px;height:calc(100% - 20px)}
.sil .ln{stroke:var(--ink);stroke-width:7;stroke-linecap:round;fill:none}
.sil .lf{stroke:var(--seg2);stroke-width:6.5;stroke-linecap:round}
.sil .hd{fill:var(--ink)}
.sil .st{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 4;stroke-linecap:round;fill:none}
.sil .fl{stroke:var(--rule);stroke-width:2}
.sil .pf{fill:var(--chip);stroke:var(--seg1);stroke-width:1.5}
.sil .pr{stroke:var(--seg1);stroke-width:5;stroke-linecap:round}
.sil .cb{stroke:var(--seg2);stroke-width:1.5}
.sil .bd{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.sil .ld{fill:var(--accent)}
.sil .pad{stroke:var(--seg1);stroke-width:7;stroke-linecap:round;fill:var(--seg1)}
.silbox .hint{position:absolute;bottom:12px;right:14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.silbox .bl{position:absolute;top:12px;left:14px}
.warnline{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--warn);background:var(--surface);border-radius:14px;padding:10px 12px}
.warnline svg{stroke:var(--warn);flex:none;margin-top:1px}
.sets{display:flex;flex-direction:column}
.sethead,.setrow{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 60px 44px;gap:8px;align-items:center}
.sethead{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);padding-bottom:6px}
.setrow{min-height:54px;border-top:1px solid var(--rule)}
.setrow .sn{font-family:var(--display);font-weight:600;font-size:18px}
.setrow.done .sn{color:var(--accent)}
.setrow .pv{font-family:var(--mono);font-size:12px;color:var(--faint)}
.setrow input{height:38px;width:100%;border-radius:10px;border:0;background:var(--surface);text-align:center;font-family:var(--display);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.setrow.done input{background:transparent}
.setrow.time{grid-template-columns:44px minmax(0,1fr) 110px 44px}
.tick{width:42px;height:42px;border-radius:999px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center}
.tick svg{stroke:var(--faint)}
.setrow.done .tick{background:var(--accent);border-color:var(--accent)}
.setrow.done .tick svg{stroke:var(--accent-ink)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{stroke:var(--accent-ink)}
.tick svg path{stroke-dasharray:30;stroke-dashoffset:0}
.setrow.just .tick svg path{animation:firma .45s ease-out}
@keyframes firma{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.holdbtn{height:38px;border-radius:999px;background:var(--chip);font-family:var(--mono);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.holdbtn.run{background:var(--ink);color:var(--bg)}
.sfoot{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sfoot .in2{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.timer{background:var(--btn);color:var(--btn-ink);border-radius:26px;padding:12px 10px 12px 20px;display:flex;flex-direction:column;gap:6px}
.timer .r{display:flex;align-items:center;gap:12px}
.timer .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;opacity:.7}
.timer .tv{font-family:var(--display);font-weight:500;font-size:26px;line-height:1}
.timer .skip{height:44px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.timer svg{width:100%;height:22px}
.timer .tb{stroke:var(--seg2);opacity:.45;stroke-width:4;fill:none;stroke-linecap:round}
.timer .tf{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}
.navbtns{display:flex;gap:10px}
.navbtns .ghostbtn{background:var(--surface);border:0;height:56px;min-width:56px}
.navbtns .ghostbtn svg{stroke:var(--ink)}
.navbtns .cta .lb{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.05;text-align:left}
.navbtns .cta .lb small{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:0;text-transform:none;opacity:.75;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtns .cta .lb span{white-space:nowrap}
.navbtns .cta svg{flex:none}
.navbtns .cta{flex:1;height:56px;font-size:19px}
/* transición */
.trans{position:fixed;inset:0;z-index:12;background:var(--bg);overflow:hidden}
.trans>svg{position:absolute;inset:0;width:100%;height:100%}
.trans>svg path{stroke:var(--accent);fill:none;stroke-width:420;stroke-linecap:round;stroke-dasharray:100 100;animation:barrido 1.4s cubic-bezier(.6,0,.3,1) forwards}
@keyframes barrido{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.trans .txt{position:absolute;left:24px;right:24px;bottom:calc(140px + env(safe-area-inset-bottom,0px));color:var(--accent-ink);display:flex;flex-direction:column;gap:10px;animation:aparece 1.6s ease forwards}
@keyframes aparece{0%,55%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
.trans .txt h1{margin:0;font-family:var(--display);font-weight:600;font-size:64px;line-height:.92;text-transform:uppercase}
.trans .txt p{margin:0;font-size:16px;line-height:1.4}
.trans .go{position:absolute;left:24px;right:24px;width:auto;bottom:calc(40px + env(safe-area-inset-bottom,0px));background:var(--accent-ink);color:var(--accent)}
.trans .go svg{stroke:var(--accent)}
/* tarjeta */
.daycard{background:var(--surface);border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:4px;border-radius:2px}
.cardimg{width:100%;border-radius:20px;display:block}
/* gráficas */
.ch{width:100%;height:auto;display:block}
.ch .gl{stroke:var(--rule);stroke-width:1}
.ch .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linecap:round}
.ch .ar{fill:var(--accent);opacity:.1}
.ch .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.ch .end{fill:var(--accent)}
.ch text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.wk path.a{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.wk path.b{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:2 6;opacity:.6}
.wk .on{fill:var(--accent)} .wk .off{fill:var(--faint)} .wk .today{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.wk text{font-family:var(--mono);font-size:11px;fill:var(--faint)} .wk text.h{fill:var(--accent)}
.seg path{fill:none;stroke-width:5;stroke-linecap:round}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:90%;text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:14px}
.danger{color:var(--warn);font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);

const OLD_SIL={bisagra:'rumano',core:'plancha',brazo:'curl',cadera:'estocada',equilibrio:'bosu',split:'mediosplit',piernarecta:'isquiosbanda'};
const silKey=k=>SIL[k]?k:(OLD_SIL[k]||'movilidad');
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function silFrames(D){
  const ease=s=>.5-.5*Math.cos(Math.PI*s);const fr=[];
  if(D.loop){for(let i=0;i<=16;i++)fr.push({k:i/16,P:D.f((i%16)/16)});return fr}
  const n=6;fr.push({k:0,P:D.a});for(let i=0;i<=n;i++)fr.push({k:.1+.35*i/n,P:lerpAny(D.a,D.b,ease(i/n))});for(let i=1;i<=n;i++)fr.push({k:.6+.35*i/n,P:lerpAny(D.b,D.a,ease(i/n))});fr.push({k:1,P:D.a});return fr;
}
function silSVG(key,opts){
  const D=SIL[silKey(key)];const anim=!reduceMotion()&&!(opts&&opts.still);
  const fr=silFrames(D).map(f=>{const o=poseOf(f.P);o._t=f.P.t==null?180:f.P.t;const lnN=f.P.lN;o._shN=Array.isArray(lnN)?lnN[1]:0;o._sh=o._shN;return {k:f.k,o}});
  const show=opts&&opts.frame!=null?fr[Math.round(opts.frame*(fr.length-1))]:(D.loop?fr[0]:fr[Math.round((fr.length-1)*.45/1)]);
  const keyT=fr.map(f=>f.k.toFixed(3)).join(';');const F=n=>Math.round(n*10)/10;
  const att=(name,vals)=>{const u=[...new Set(vals.map(F))];if(!anim||u.length===1)return ' '+name+'="'+F(anim?vals[0]:vals[fr.indexOf(show)])+'"';return ' '+name+'="'+F(vals[0])+'"'};
  const ani=(name,vals)=>{if(!anim)return '';const u=[...new Set(vals.map(F))];if(u.length===1)return '';return '<animate attributeName="'+name+'" values="'+vals.map(F).join(';')+'" keyTimes="'+keyT+'" dur="'+(D.loop?2.4:3.4)+'s" repeatCount="indefinite"/>'};
  const seg=(a,b,cls)=>{const X1=fr.map(f=>f.o[a][0]),Y1=fr.map(f=>f.o[a][1]),X2=fr.map(f=>f.o[b][0]),Y2=fr.map(f=>f.o[b][1]);return '<line class="'+cls+'"'+att('x1',X1)+att('y1',Y1)+att('x2',X2)+att('y2',Y2)+'>'+ani('x1',X1)+ani('y1',Y1)+ani('x2',X2)+ani('y2',Y2)+'</line>'};
  const dynEl=(p)=>{const r=fr.map(f=>p.dyn(f.o));const g=r[0];if(g.circ){const X=r.map(x=>x.circ[0]),Y=r.map(x=>x.circ[1]);return '<circle class="'+g.c+'" r="'+g.r+'"'+att('cx',X)+att('cy',Y)+'>'+ani('cx',X)+ani('cy',Y)+'</circle>'}
    const X1=r.map(x=>x.line[0]),Y1=r.map(x=>x.line[1]),X2=r.map(x=>x.line[2]),Y2=r.map(x=>x.line[3]);return '<line class="'+g.c+'"'+att('x1',X1)+att('y1',Y1)+att('x2',X2)+att('y2',Y2)+'>'+ani('x1',X1)+ani('y1',Y1)+ani('x2',X2)+ani('y2',Y2)+'</line>'};
  const front=!!(D.a||D.f(0)).front;const props=D.props||[];
  // límites para ajustar el encuadre
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const grow=(x,y,m)=>{m=m||0;x0=Math.min(x0,x-m);y0=Math.min(y0,y-m);x1=Math.max(x1,x+m);y1=Math.max(y1,y+m)};
  fr.forEach(f=>Object.keys(f.o).forEach(k=>{if(k[0]!=='_'&&k!=='tc')grow(f.o[k][0],f.o[k][1],k==='head'?11:4)}));
  props.forEach(p=>{if(p.rect)grow(p.rect[0],p.rect[1]),grow(p.rect[0]+p.rect[2],p.rect[1]+p.rect[3]);if(p.line)grow(p.line[0],p.line[1]),grow(p.line[2],p.line[3]);if(p.path)p.path.replace(/[A-Z]/g,' ').trim().split(/\s+/).reduce((a,v,i,arr)=>{if(i%2)grow(Number(arr[i-1]),Number(v));return a},0)});
  if(D.floor)grow(x0,141);
  let W=x1-x0+20,H=y1-y0+16;const R=1.42;if(W/H<R){const nw=H*R;x0-=(nw-W)/2;W=nw}else{const nh=W/R;y0-=(nh-H)/2;H=nh}
  const vb=[F(x0-10),F(y0-8),F(W),F(H)].join(' ');
  let s='<svg class="sil" viewBox="'+vb+'" fill="none" role="img" aria-label="Movimiento: '+esc(D.label)+'">';
  if(D.floor)s+='<line class="fl" x1="'+F(x0-20)+'" y1="141" x2="'+F(x0+W+10)+'" y2="141"/>';
  props.forEach(p=>{if(p.rect)s+='<rect class="pf" x="'+p.rect[0]+'" y="'+p.rect[1]+'" width="'+p.rect[2]+'" height="'+p.rect[3]+'" rx="'+p.rect[4]+'"/>';else if(p.line)s+='<line class="'+p.c+'" x1="'+p.line[0]+'" y1="'+p.line[1]+'" x2="'+p.line[2]+'" y2="'+p.line[3]+'"/>';else if(p.path)s+='<path class="pf" d="'+p.path+'"/>';else if(p.dyn&&p.z==='back')s+=dynEl(p)});
  // trazo del movimiento
  const tk=D.trail||'wN';const tp=fr.filter((f,i)=>D.loop||(f.k>=.1&&f.k<=.45)).map(f=>[f.o[tk][0],f.o[tk][1]]);
  if(tp.length>1)s+='<path class="st" d="M'+tp.map(p=>F(p[0])+' '+F(p[1])).join(' L')+(D.loop?'Z':'')+'"/>';
  const farC=front?'ln':'lf';
  s+=seg('sh','eF',farC)+seg('eF','wF',farC)+seg('hip','kF',farC)+seg('kF','aF',farC)+seg('aF','tF',farC);
  // torso (curvo si hace falta)
  const TD=fr.map(f=>'M'+F(f.o.hip[0])+' '+F(f.o.hip[1])+' Q'+F(f.o.tc[0])+' '+F(f.o.tc[1])+' '+F(f.o.sh[0])+' '+F(f.o.sh[1]));
  s+='<path class="ln" d="'+(anim?TD[0]:TD[fr.indexOf(show)])+'">'+(anim&&new Set(TD).size>1?'<animate attributeName="d" values="'+TD.join(';')+'" keyTimes="'+keyT+'" dur="'+(D.loop?2.4:3.4)+'s" repeatCount="indefinite"/>':'')+'</path>';
  if(front)s+=seg('shL','shR','ln')+seg('hipL','hipR','ln');
  s+=seg('sh','head','ln')+seg('hip','kN','ln')+seg('kN','aN','ln')+seg('aN','tN','ln');
  props.forEach(p=>{if(p.dyn&&p.z==='mid')s+=dynEl(p)});
  s+=seg('sh','eN','ln')+seg('eN','wN','ln');
  const HX=fr.map(f=>f.o.head[0]),HY=fr.map(f=>f.o.head[1]);s+='<circle class="hd" r="10.5"'+att('cx',HX)+att('cy',HY)+'>'+ani('cx',HX)+ani('cy',HY)+'</circle>';
  props.forEach(p=>{if(p.dyn&&p.z==='front')s+=dynEl(p)});
  return s+'</svg>';
}

const HOW={
 c1:{s:['Ajusta el asiento: con el pedal abajo, la rodilla queda apenas doblada.','Pedalea a un ritmo en el que todavía puedas hablar.','Los últimos 2 minutos sube un poco la resistencia.'],o:'No te cuelgues del manubrio: espalda larga y hombros sueltos.'},
 c2:{s:['Empieza en plancha sobre los antebrazos, cuerpo en línea recta.','Apoya una mano y luego la otra hasta quedar con los brazos estirados.','Baja a los antebrazos un brazo a la vez. Alterna con cuál empiezas.'],o:'La cadera no se balancea ni se cae. Si Santiago te lo indicó distinto, manda lo de él.'},
 c3:{s:['Párate con un pie en el centro del domo.','Rodilla suave, no bloqueada, y la mirada fija en un punto.','Aguanta el tiempo. Si es fácil, mueve los brazos o cierra los ojos un momento.'],o:'Ten algo cerca para agarrarte si pierdes el equilibrio.'},
 s1:{s:['Barra liviana en la parte alta de la espalda, pies al ancho de la cadera.','Rodillas apenas dobladas y fijas.','Lleva la cadera hacia atrás y baja el pecho con la espalda recta hasta sentir los isquios.','Sube apretando glúteos.'],o:'Baja solo hasta donde mantengas la espalda recta.'},
 s2:{s:['Acostado boca arriba, banda en la planta del pie.','Sube la pierna recta hasta sentir el estiramiento.','Empuja el pie contra la banda 5 segundos, sin moverlo.','Suelta, respira y gana un poco más de rango. Repite.'],o:'La otra pierna queda estirada en el piso y la cadera no se levanta.'},
 s3:{s:['Sentado al borde del banco, espalda un poco redondeada.','Estira la rodilla mientras subes la cabeza (miras arriba).','Dobla la rodilla mientras bajas la cabeza.','Movimiento suave y continuo, como un vaivén.'],o:'No es un estiramiento: no busques el límite ni lo sostengas.'},
 s4:{s:['Rodilla de atrás en el piso (sobre algo blando); la de adelante, sobre el tobillo.','Aprieta el glúteo de la pierna de atrás.','Lleva la cadera hacia adelante sin arquear la espalda baja.','Para más, sube el brazo del lado de atrás.'],o:'Se siente adelante de la cadera de atrás, no en la espalda baja.'},
 s5:{s:['Rodilla de atrás en el piso, debajo de la cadera.','Pierna de adelante estirada, talón en el piso y punta arriba.','Inclínate desde la cadera con la espalda larga; manos en el piso o en bloques.'],o:'No redondees para llegar más lejos: es la misma bisagra de tu meta de tocar los pies.'},
 s9:{s:['Una pierna adelante y otra atrás, cadera cuadrada mirando al frente.','Manos en bloques a los lados para controlar el peso.','Baja la cadera hacia el piso hasta donde llegue y respira.'],o:'Que la cadera no se abra hacia la pierna de atrás.'},
 s10:{s:['Lo que te pida el cuerpo de tu rutina de contempo.','Prioriza lo que esté más tenso ese día.'],o:''},
 s6:{s:['Párate sobre un cajón o banco con un peso liviano en las manos.','Mentón al pecho y baja enrollando la columna, vértebra por vértebra.','Deja que el peso baje más allá de los pies, sin rebotar.','Sube desenrollando desde abajo; la cabeza llega de última.'],o:'Peso muy liviano y lento. Rodillas estiradas, sin bloquear.'},
 s7:{s:['Desde cuatro apoyos, lleva una rodilla adelante, detrás de la muñeca del mismo lado.','Estira la pierna de atrás en el piso.','Cadera cuadrada; si queda alta, pon un bloque debajo.','Para más, baja el pecho hacia el piso.'],o:'Si molesta la rodilla de adelante, acerca el pie a la cadera.'},
 s8:{s:['Sentado, plantas de los pies juntas y talones cerca de la cadera.','Espalda larga; toma los pies con las manos.','Deja que las rodillas bajen solas. Para más, inclínate desde la cadera.'],o:'No empujes las rodillas con las manos.'},
 f1:{s:['Acostado, ojos debajo de la barra, pies firmes en el piso.','Junta las escápulas y saca el pecho.','Baja la barra controlada a la parte baja del pecho, codos a unos 45° del cuerpo.','Empuja hasta estirar los brazos sin despegar los glúteos.'],o:'Muñecas rectas: la barra sobre la palma, no en los dedos.'},
 f6:{s:['Banco a 30–45°; sube las mancuernas apoyándolas en los muslos.','Escápulas juntas, mancuernas a la altura del pecho.','Empuja hacia arriba juntándolas un poco, sin chocarlas.','Baja controlado hasta sentir el pecho abierto.'],o:'No arquees de más la espalda baja.'},
 f8:{s:['Ajusta el asiento para que las manijas queden a la altura del pecho.','Codos apenas doblados y fijos.','Junta los brazos al frente apretando el pecho; pausa de 1 segundo.','Vuelve lento hasta sentir el pecho abierto.'],o:'Los hombros no se suben hacia las orejas.'},
 f21:{s:['Elige el contrapeso: más contrapeso = más ayuda.','Manos en las barras, brazos estirados, rodillas en la plataforma.','Baja doblando los codos con el torso un poco inclinado hacia adelante.','Sube empujando hasta estirar los brazos.'],o:'Aquí progresar es BAJAR el contrapeso. Baja solo hasta donde el hombro esté cómodo.'},
 f4:{s:['Muslos fijos bajo el rodillo, agarre neutro al ancho de los hombros.','Inclínate apenas hacia atrás con el pecho arriba.','Lleva la barra a la parte alta del pecho bajando los codos hacia las costillas.','Sube controlado hasta estirar los brazos.'],o:'No balancees el torso para bajarla.'},
 f2:{s:['Pecho contra el apoyo y pies firmes.','Toma las manijas con los brazos estirados.','Lleva los codos atrás pegados al cuerpo y aprieta los omóplatos al final.','Vuelve lento sin despegar el pecho.'],o:'Tira con la espalda; los brazos solo conectan.'},
 f9:{s:['Polea a la altura de la cara, cuerda con agarre por encima.','Un paso atrás, brazos estirados al frente.','Tira hacia la cara separando las manos, codos altos.','Pausa de 1 segundo y vuelve lento.'],o:'Peso liviano: es para hombros y postura, no para mover kilos.'},
 f22:{s:['Inclínate desde la cadera con la espalda recta, mancuernas colgando.','Codos apenas doblados.','Abre los brazos hacia los lados hasta la altura de los hombros.','Baja lento.'],o:'Sin impulso: si necesitas balancearte, baja el peso.'},
 f7:{s:['Banco inclinado, pecho apoyado y pies en el piso.','Mancuernas colgando con los brazos estirados.','Lleva los codos atrás y arriba apretando los omóplatos.','Baja controlado.'],o:'El pecho no se despega del banco.'},
 f11:{s:['Barra en la parte alta de la espalda, pies al ancho de los hombros.','Toma aire y aprieta el abdomen.','Baja llevando la cadera atrás y abajo; rodillas en la dirección de los pies.','Sube empujando el piso con todo el pie.'],o:'Baja hasta muslo paralelo o hasta donde la espalda siga neutra.'},
 f12:{s:['Espalda y cadera pegadas al respaldo, pies al ancho de la cadera.','Quita los seguros y baja hasta que las rodillas se acerquen al pecho, sin despegar la cadera.','Empuja con todo el pie hasta casi estirar.'],o:'No bloquees las rodillas arriba.'},
 f13:{s:['Ajusta el respaldo para que la rodilla quede alineada con el eje de la máquina.','Rodillo encima de los tobillos.','Estira las rodillas y pausa 1 segundo arriba.','Baja lento.'],o:'Sin impulso; la espalda pegada al respaldo.'},

const netDown=err=>navigator.onLine===false||/fetch|network|load failed/i.test(String((err&&err.message)||err||''));
async function push(){
  if(!cloudReady()){setSync(cloud.sb?'nologin':'local');return}
  if(cloud.writing){cloud.again=true;return}
  cloud.writing=true;setSync('syncing');let error=null;
  try{({error}=await cloud.sb.from('trazo_state').upsert({user_id:cloud.session.user.id,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()}))}catch(e){error=e}
  cloud.writing=false;
  if(error)setSync(netDown(error)?'offline':'error');else{cloud.dirty=false;cloud.last=Date.now();setSync('ok');markSynced()}
  if(cloud.again){cloud.again=false;push()}
}

const SYNC_UID='trazo-synced-uid';
const syncedUid=()=>{try{return localStorage.getItem(SYNC_UID)}catch(e){return null}};
const markSynced=()=>{try{if(cloud.session)localStorage.setItem(SYNC_UID,cloud.session.user.id)}catch(e){}};
/* Primera vez que esta cuenta se sincroniza en este celular: manda la nube, pero se suman las sesiones, medidas y la sesión en curso que solo estaban aquí. */
function mergeLocal(local,into){let added=false;
  const sid=new Set(into.sessions.map(x=>x.id));(local.sessions||[]).forEach(x=>{if(!sid.has(x.id)){into.sessions.push(x);added=true}});
  if(added){into.sessions.sort((a,b)=>(a.start||0)-(b.start||0));into.sessions.forEach((x,i)=>x.n=i+1)}
  const mid=new Set(into.measures.map(x=>x.id));(local.measures||[]).forEach(x=>{if(!mid.has(x.id)){into.measures.push(x);added=true}});
  if(local.draft&&!into.draft){into.draft=local.draft;added=true}
  return added}
async function pull(){
  if(!cloudReady()||cloud.writing)return;
  setSync('syncing');let data=null,error=null;
  try{({data,error}=await cloud.sb.from('trazo_state').select('data').eq('user_id',cloud.session.user.id).maybeSingle())}catch(e){error=e}
  if(error){setSync(netDown(error)?'offline':'error');return}
  const remote=data&&data.data;
  if(remote&&syncedUid()!==cloud.session.user.id&&!stack.includes('session')){const d=migrate(JSON.parse(JSON.stringify(remote)));if(d){const localNewer=(S.updatedAt||0)>(remote.updatedAt||0);const base=localNewer?S:d;const added=mergeLocal(localNewer?d:S,base)||localNewer;S=base;persist();markSynced();if(!overlay())render();else if(sheetState&&sheetState.kind==='account')rerenderSheet();if(added){toast('Se juntaron los datos de este celular con los de la nube');save()}else{cloud.dirty=false;cloud.last=Date.now();setSync('ok')}return}}
  if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)&&!stack.includes('session')){
    const d=migrate(JSON.parse(JSON.stringify(remote)));
    if(d){S=d;persist();cloud.dirty=false;cloud.last=Date.now();setSync('ok');if(!overlay())render();else if(sheetState&&sheetState.kind==='account')rerenderSheet();return}
  }
  if(!remote||(S.updatedAt||0)>(remote.updatedAt||0)||stack.includes('session')){if(!S.updatedAt)S.updatedAt=Date.now();persist();await push();return}
  cloud.dirty=false;cloud.last=Date.now();setSync('ok');markSynced();
}
async function initCloud(){
  const make=window.supabase&&window.supabase.createClient;
  if(!CFG.url||!CFG.key||!make){setSync('local');return}
  try{
    cloud.sb=make(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'trazo-auth'}});
    const {data}=await cloud.sb.auth.getSession();cloud.session=(data&&data.session)||null;
    cloud.sb.auth.onAuthStateChange((ev,s)=>{cloud.session=s||null;if(ev==='SIGNED_IN')setTimeout(pull,0);if(ev==='SIGNED_OUT'){setSync('nologin');setTimeout(()=>{if(!overlay())render()},0)}});
    if(cloud.session)await pull();else setSync('nologin');
    if(!overlay())render();
  }catch(e){cloud.sb=null;cloud.session=null;setSync('local')}
}

function authErr(e){

  if(m.includes('invalid login'))return 'Correo o contraseña incorrectos. Es la misma cuenta de Fibra.';
  if(m.includes('not confirmed'))return 'Falta confirmar el correo: abre el link que te llegó y luego dale Entrar.';
  if(m.includes('rate limit'))return 'Demasiados intentos seguidos. Espera unos minutos.';
  if(m.includes('email')&&m.includes('invalid'))return 'Revisa el correo, parece que tiene un error.';
  return 'No se pudo: '+((e&&e.message)||'error desconocido');
}

  t+='## Rutina actual\nMeta: '+S.settings.goal+' días por semana. Mis días rotan en orden: si no voy, sigue el que toca. Cada sesión es calentamiento, estiramiento y fuerza, no siempre en ese orden.\n';
  t+='Progresión de la app: si completo el rango de repeticiones en todas las series, sugiere subir 2,5 kg (1 kg en laterales). Las sesiones marcadas "tras bailar" (vengo de clase de danza) no cuentan para subir peso ni récords.\n';
  const md=myDays(),same=b=>md.every(d=>d[b].join()===md[0][b].join());const shared=['cal','est'].filter(b=>md.length>1&&same(b));
  const blk=(d,b)=>{const l=d[b].map(exOf).filter(Boolean);return l.length?'- '+BLOCKS[b]+': '+l.map(e=>e.name+' ('+rx(e)+(e.flag?', carga el antebrazo':'')+')').join('; ')+'\n':''};
  if(shared.length){t+='\nEn todos los días\n';shared.forEach(b=>t+=blk(md[0],b))}
  md.forEach(d=>{t+='\n'+d.name+' · '+d.focus+'\n';['cal','est','fue'].filter(b=>!shared.includes(b)).forEach(b=>t+=blk(d,b))});
  const duv=S.days.filter(d=>d.plan==='duvan');if(duv.length)t+='\nDías del plan de Duván (no rotan): '+duv.map(d=>d.name+' · '+d.focus).join(', ')+'\n';
  t+='\n## Semanas\n';
  for(let m=weekStart(f);iso(m)<=tk;m.setDate(m.getDate()+7)){const e=new Date(m);e.setDate(m.getDate()+7);const n=new Set(S.sessions.filter(s=>{const d=parseISO(s.date);return d>=m&&d<e}).map(s=>s.date)).size;t+='- Semana del '+iso(m)+': '+n+' de '+S.settings.goal+' días'+(iso(new Date(e.getTime()-864e5))>tk?' (en curso)':'')+'\n'}

let T=null,tickH=null,wakeLock=null,audioCtx=null;
function buildDraft(d){
  const steps=[];['cal','est','fue'].forEach(b=>d[b].forEach(id=>exOf(id)&&steps.push({t:b,id})));
  const log={};[...d.cal,...d.est,...d.fue].forEach(id=>{const e=exOf(id);if(!e)return;const n=e.sets*(e.side?2:1);const last=e.block==='fue'?lastSetsFor(id):null;const sg=e.block==='fue'?suggest(e,S.dance===iso()):null;
    log[id]={sets:Array.from({length:n},(_,k)=>{const lp=last&&last[Math.min(k,last.length-1)];return {kg:null,reps:null,done:false,ph:sg?sg.kg:(lp&&lp.kg!=null?lp.kg:null),prev:lp?lp:null}})}});
  return {dayId:d.id,start:Date.now(),step:0,steps,log,trans:false,transShown:false,prefer:S.prefer||null,danced:S.dance===iso()};
}
function startSession(){
  if(!S.draft){S.draft=buildDraft(curDay());save()}
  if(!S.draft.steps.length){toast('Este día no tiene ejercicios. Agrégale algunos en Rutina.');S.draft=null;save();return}
  pushLayer('session');renderSession();
  const R=S.draft&&S.draft.rest;if(R&&R.end>Date.now()+1000){T={kind:'rest',end:R.end,total:R.total,id:R.id,k:R.k};tickH=setInterval(tick,200);renderFoot();tick()}else if(R){delete S.draft.rest;persist()}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{})}catch(e){}
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}

  $('#cardwrap').hidden=true;$('#cardimg').innerHTML='<img class="cardimg" src="'+url+'" alt="Tarjeta del día de la sesión '+s.n+'"><p class="quip" style="text-align:center;margin:10px auto 0;font-size:13px">Mantén presionada la imagen para guardarla en tu galería.</p>';
}

/* ---------- acciones ---------- */
const A={
  tab:el=>{const v=el.dataset.v;if(v===tab){window.scrollTo({top:0,behavior:'smooth'});return}
    if(v==='hoy'){if(stack[stack.length-1]==='tab'){closeTop();return}tab='hoy'}else{if(!stack.includes('tab'))pushLayer('tab');tab=v}render();window.scrollTo(0,0)},
  pickday:el=>{const id=el.dataset.v;S.sel=nextMine().id===id?null:id;save();render()},
  start:()=>startSession(),
  exitsession:()=>{save();closeTop();toast('Tu sesión quedó guardada. Toca Continuar para seguir.')},
  next:()=>{const D=S.draft;let i=nextIdx(D);if(i<0){finishSession();return}if(D.steps[i].t==='fue'&&D.steps[D.step].t!=='fue'&&D.prefer){const p=D.steps.findIndex(s=>s.id===D.prefer);if(p>=0&&!stepDone(D,D.steps[p]))i=p}gotoStep(i)},
  duv:el=>{const g=el.dataset.v;S.duv=(S.duv&&S.duv.date===iso()&&S.duv.g===g)?null:{date:iso(),g};save();render()},
  useduv:el=>{const id=el.dataset.v;S.sel=nextMine().id===id?null:id;S.prefer=el.dataset.x;save();render()},
  dance:()=>{const on=S.dance===iso();S.dance=on?null:iso();if(S.draft)S.draft.danced=!on;save();render()},
  jump:el=>{const D=S.draft;const b=el.dataset.v;let i=-1;if(b==='fue'&&D.prefer){const p=D.steps.findIndex(s=>s.id===D.prefer);if(p>=0&&!stepDone(D,D.steps[p]))i=p}if(i<0)i=D.steps.findIndex(s=>s.t===b&&!stepDone(D,s));if(i<0)i=D.steps.findIndex(s=>s.t===b);gotoStep(i)},
  goto:el=>gotoStep(Number(el.dataset.v)),
  endtrans:()=>{S.draft.trans=false;save();renderSession()},
  prev:()=>{const D=S.draft;if(D.step>0)gotoStep(D.step-1)},
  finish:el=>{const D=S.draft;if(!D)return;const left=D.steps.filter(st=>!stepDone(D,st)).length;if(el&&el.dataset.sure!=='1'&&left&&!D.askEnd){D.askEnd=true;renderSession();return}finishSession()},
  noend:()=>{S.draft.askEnd=false;renderSession()},
  stalekeep:()=>{if(!S.draft)return;pushLayer('session');finishSession()},
  staledrop:()=>{S.draft=null;save();render();toast('Sesión descartada')},
  toggleset:el=>{wakeAudio();const id=el.dataset.id,k=Number(el.dataset.k);const s=S.draft.log[id].sets[k];const e=exOf(id);s.done=!s.done;S.draft.last=Date.now();
    if(s.done){if(s.kg==null&&s.ph!=null&&e.block==='fue')s.kg=s.ph;if(s.reps==null&&e.block==='fue'&&e.kind!=='time'){const r=parseInt(String(e.target).split('-').pop());if(!isNaN(r))s.reps=r}justDone=id+'_'+k;
      if(T&&T.kind==='hold'&&T.id===id&&T.k===k)stopTimer();
      const L=S.draft.log[id].sets;const rest=e.rest!=null?Number(e.rest):S.settings.rest;const lastOfAll=L.every(x=>x.done)&&nextIdx(S.draft)<0;
      if(e.block!=='cal'&&rest>0&&!lastOfAll&&!(e.side&&k%2===0))startTimer('rest',rest,id,k)}
    save();renderSession()},
  addset:el=>{const L=S.draft.log[el.dataset.id].sets;const l=L[L.length-1];L.push({kg:null,reps:null,done:false,ph:l?(l.kg!=null?l.kg:l.ph):null,prev:null});save();renderSession()},
  hold:el=>{wakeAudio();const id=el.dataset.id,k=Number(el.dataset.k);if(T&&T.kind==='hold'&&T.id===id&&T.k===k){stopTimer();renderSession();return}startTimer('hold',Number(exOf(id).target)||45,id,k);renderSession()},
  skiprest:()=>{stopTimer();renderFoot()},
  cardimage:el=>cardImage(el.dataset.v),
  closecard:()=>closeTop(),
  editday:el=>showSheet({kind:'day',i:Number(el.dataset.v)}),
  addday:()=>{const m=myDays();const base=m[0];const d={id:uid(),name:'Día '+(m.length+1),focus:'Nuevo',plan:'mio',cal:base?base.cal.slice():[],est:base?base.est.slice():[],fue:[]};const at=m.length?S.days.indexOf(m[m.length-1])+1:0;S.days.splice(at,0,d);save();render();showSheet({kind:'day',i:at})},
  dayadd:el=>{sheetState.adding=sheetState.adding===el.dataset.v?null:el.dataset.v;rerenderSheet()},
  daypick:el=>{const d=S.days[sheetState.i];d[sheetState.adding].push(el.dataset.v);save();rerenderSheet();render()},
  daymv:el=>{const d=S.days[sheetState.i],b=el.dataset.b,k=Number(el.dataset.k),j=k+Number(el.dataset.d);if(j<0||j>=d[b].length)return;[d[b][k],d[b][j]]=[d[b][j],d[b][k]];save();rerenderSheet()},
  dayrm:el=>{const d=S.days[sheetState.i];d[el.dataset.b].splice(Number(el.dataset.k),1);save();rerenderSheet();render()},
  copyblocks:()=>{const d=S.days[sheetState.i];S.days.forEach(x=>{x.cal=d.cal.slice();x.est=d.est.slice()});save();toast('Calentamiento y estiramiento copiados a todos los días');render()},
  setnext:()=>{const d=S.days[sheetState.i];if(d.plan==='duvan')S.sel=d.id;else{S.next=myDays().indexOf(d);S.sel=null}save();rerenderSheet();render();toast(d.plan==='duvan'?d.name+' es el de hoy':d.name+' es el siguiente')},
  delday:()=>{const i=sheetState.i;const d=S.days[i];const mi=myDays().indexOf(d);S.days.splice(i,1);if(mi>=0&&S.next>mi)S.next--;if(S.sel===d.id)S.sel=null;save();closeTop();render()},
  askconfirm:()=>{sheetState.confirm=true;rerenderSheet()},
  noconfirm:()=>{sheetState.confirm=false;rerenderSheet()},
  newex:el=>{const b=el.dataset.v||'fue';const back=sheetState&&sheetState.kind==='day'?{kind:'day',i:sheetState.i,adding:b}:null;const e={id:'x'+uid(),name:'',block:b,kind:'reps',sets:3,target:b==='fue'?'10':'8',side:false,rest:b==='fue'?S.settings.rest:30,tip:'',sil:b==='est'?'pliegue':b==='cal'?'movilidad':'empuje',flag:false};
    if(sheetState){sheetState={kind:'ex',e,isNew:true,back};rerenderSheet()}else showSheet({kind:'ex',e,isNew:true,back})},
  editex:el=>showSheet({kind:'ex',e:Object.assign({},S.ex[el.dataset.v]),isNew:false}),
  saveex:()=>{const e=sheetState.e;if(!e.name.trim()){toast('Ponle un nombre al ejercicio');document.getElementById('ename').focus();return}
    e.sets=Math.max(1,parseInt(e.sets)||1);e.rest=Math.max(0,parseInt(e.rest)||0);if(e.kind==='time')e.target=Math.max(5,parseInt(e.target)||45);else e.target=String(e.target||'10').trim();
    const old=S.ex[e.id];if(old&&old.block!==e.block)S.days.forEach(d=>{d[old.block]=d[old.block].filter(x=>x!==e.id)});
    S.ex[e.id]=e;const back=sheetState.back;if(back){const d=S.days[back.i];if(d&&!d[e.block].includes(e.id))d[e.block].push(e.id)}save();render();
    if(back){sheetState={kind:'day',i:back.i};rerenderSheet()}else closeTop();toast('Guardado')},
  delex:()=>{const id=sheetState.e.id;delete S.ex[id];S.days.forEach(d=>['cal','est','fue'].forEach(b=>d[b]=d[b].filter(x=>x!==id)));save();closeTop();render()},
  measure:el=>{const id=el.dataset.v;const m=id?S.measures.find(x=>x.id===id):null;showSheet({kind:'measure',isNew:!m,m:m?{id:m.id,date:m.date,v:Object.assign({},m.v)}:{id:uid(),date:iso(),v:{}}})},
  savemeasure:()=>{const m=sheetState.m;Object.keys(m.v).forEach(k=>{if(m.v[k]==null)delete m.v[k]});if(!Object.keys(m.v).length){toast('Llena al menos una medida');return}
    const i=S.measures.findIndex(x=>x.id===m.id);if(i>=0)S.measures[i]=m;else S.measures.push(m);save();closeTop();render();toast('Medidas guardadas')},
  delmeasure:()=>{S.measures=S.measures.filter(x=>x.id!==sheetState.m.id);save();closeTop();render()},
  edittests:()=>{sheetState.editTests=true;rerenderSheet()},
  donetests:()=>{S.flexTests=S.flexTests.filter(t=>t.name.trim());save();sheetState.editTests=false;rerenderSheet();render()},
  addtest:()=>{S.flexTests.push({id:'t'+uid(),name:'Nueva prueba',unit:'cm',better:'up',hint:''});save();rerenderSheet()},
  deltest:el=>{S.flexTests.splice(Number(el.dataset.v),1);save();rerenderSheet()},
  sessinfo:el=>showSheet({kind:'sess',id:el.dataset.v}),
  delsession:()=>{S.sessions=S.sessions.filter(x=>x.id!==sheetState.id);S.sessions.forEach((s,i)=>s.n=i+1);save();closeTop();render()},
  backup:()=>showSheet({kind:'backup'}),
  copybackup:()=>{const ta=document.getElementById('bout');const done=()=>toast('Copiado');try{navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();toast('Selecciónalo y cópialo')})}catch(e){ta.select();toast('Selecciónalo y cópialo')}},
  askrestore:()=>{const v=document.getElementById('bin').value.trim();if(!v){toast('Pega primero el texto de una copia');return}sheetState.pending=v;sheetState.confirm=true;rerenderSheet();document.getElementById('bin').value=v},
  restore:()=>{try{const d=migrate(JSON.parse(sheetState.pending));if(!d||!d.ex||!d.days)throw 0;S=d;S.draft=null;save();closeTop();render();toast('Datos restaurados')}catch(e){toast('Ese texto no es una copia válida de Trazo');sheetState.confirm=false;rerenderSheet()}},
  account:()=>{if(sheetState){sheetState={kind:'account'};rerenderSheet()}else showSheet({kind:'account'})},
  signin:async()=>{const email=(document.getElementById('lemail').value||'').trim(),password=document.getElementById('lpass').value||'';const msg=t=>{const m=document.getElementById('lmsg');if(m)m.textContent=t};
    if(!email||!password){msg('Escribe tu correo y tu contraseña.');return}msg('Entrando…');
    try{const r=await cloud.sb.auth.signInWithPassword({email,password});if(r.error){msg(authErr(r.error));return}cloud.session=r.data.session;closeTop();render();toast('Listo. Ahora tus datos se guardan en la nube');setTimeout(pull,0)}catch(e){msg(navigator.onLine===false?'Sin internet. Intenta cuando tengas conexión.':'No se pudo conectar. Intenta de nuevo.')}},
  syncnow:async()=>{await (cloud.dirty?push():pull());rerenderSheet()},
  signout:async()=>{try{await cloud.sb.auth.signOut()}catch(e){}cloud.session=null;setSync('nologin');closeTop();render();toast('Sesión cerrada')},
  aicopy:()=>{const t=aiText();const fb=()=>showSheet({kind:'ai',text:t});try{navigator.clipboard.writeText(t).then(()=>toast('Copiado. Pégalo en tu proyecto de Claude')).catch(fb)}catch(e){fb()}},
  how:()=>{howOpen=!howOpen;renderSession()},
  closesheet:()=>closeTop(),
  scrim:(el,ev)=>{if(ev.target===el)closeTop()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.dataset.a!=='scrim')ev.stopPropagation();f(el,ev)}});
document.addEventListener('input',ev=>{
  const el=ev.target,k=el.dataset.in;if(!k)return;
  if(k==='kg'||k==='reps'){const L=S.draft.log[el.dataset.id].sets,ki=Number(el.dataset.k),s=L[ki];const n=parseNum(el.value);s[k]=k==='reps'&&n!=null?Math.round(n):n;
    if(k==='kg'&&n!=null)for(let j=ki+1;j<L.length;j++){if(L[j].done||L[j].kg!=null)continue;L[j].ph=n;const inp=document.getElementById('kg_'+el.dataset.id+'_'+j);if(inp)inp.placeholder=fmtNum(n)}
    save();return}
  if(k==='goal'){S.settings.goal=Math.min(7,Math.max(1,parseInt(el.value)||S.settings.goal));save();return}
  if(k==='rest'){S.settings.rest=Math.max(0,parseInt(el.value)||S.settings.rest);save();return}
  if(k==='dname'||k==='dfocus'){S.days[sheetState.i][k==='dname'?'name':'focus']=el.value;save();render();return}
  if(k.startsWith('e.')){const f=k.slice(2);sheetState.e[f]=el.type==='checkbox'?el.checked:f==='how'?el.value.split('\n').map(x=>x.trim()).filter(Boolean):el.value;if(f==='kind'){sheetState.e.target=el.value==='time'?45:'10';rerenderSheet()}if(f==='sil')rerenderSheet();return}
  if(k==='mv'){sheetState.m.v[el.dataset.k]=parseNum(el.value);return}
  if(k==='mdate'){if(el.value)sheetState.m.date=el.value;return}
  if(k==='tname'||k==='tunit'||k==='thint'||k==='tbetter'){const t=S.flexTests[Number(el.dataset.i)];t[{tname:'name',tunit:'unit',thint:'hint',tbetter:'better'}[k]]=el.value;save();return}
  if(k==='progex'){progEx=el.value;render();return}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.type==='checkbox'&&el.dataset.in&&el.dataset.in.startsWith('e.')&&sheetState&&sheetState.e)sheetState.e[el.dataset.in.slice(2)]=el.checked});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(T)tick();if(stack.includes('session')&&navigator.wakeLock&&!wakeLock){try{navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{})}catch(e){}}}});

render();
initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
