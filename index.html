<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trazo</title>
<meta name="theme-color" content="#ECE8E1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>
<style>
/* Layout: una columna de teléfono (máx. 480px), barra inferior fija, pantallas completas para la sesión y hojas desde abajo para editar. */
:root{
  --bg:#ECE8E1; --surface:#F6F3EE; --ink:#1E1D1B; --muted:#6F6A62; --faint:#A39C91;
  --rule:#D6D0C6; --line:#DAD4CA; --accent:#3E5C7A; --accent-ink:#F6F3EE;
  --seg1:#C9C2B6; --seg2:#8C857A; --chip:#E0DBD2; --btn:#1E1D1B; --btn-ink:#ECE8E1; --warn:#9A5A2C;
  --display:'Oswald','Arial Narrow',sans-serif; --body:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --surface:#21201E; --ink:#ECE8E1; --muted:#A39C91; --faint:#6E685F;
  --rule:#2E2C29; --line:#262522; --accent:#93AECA; --accent-ink:#171716;
  --seg1:#3A3834; --seg2:#7A746B; --chip:#2A2825; --btn:#ECE8E1; --btn-ink:#171716; --warn:#D49A6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --surface:#21201E; --ink:#ECE8E1; --muted:#A39C91; --faint:#6E685F;
  --rule:#2E2C29; --line:#262522; --accent:#93AECA; --accent-ink:#171716;
  --seg1:#3A3834; --seg2:#7A746B; --chip:#2A2825; --btn:#ECE8E1; --btn-ink:#171716; --warn:#D49A6A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:480px;margin:0 auto;padding:0 20px 120px;position:relative;min-height:100%}
.bgcurves{position:absolute;inset:0 0 auto 0;height:300px;pointer-events:none;overflow:hidden}
.bgcurves path{stroke:var(--line);stroke-width:1.5;fill:none}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:20px;position:relative}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.04em}
.brand svg path{stroke:var(--accent)}
.pill{display:flex;align-items:center;gap:6px;border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px}
.pill b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent)}
h1.big{margin:0;font-family:var(--display);font-weight:600;font-size:54px;line-height:.95;text-transform:uppercase;text-wrap:balance}
h1.big em{font-style:normal;color:var(--accent)}
h2.sec{margin:0;font-family:var(--display);font-weight:600;font-size:30px;text-transform:uppercase;line-height:1}
.quip{margin:0;color:var(--muted);line-height:1.45;max-width:36ch}
.stack{display:flex;flex-direction:column;gap:20px;position:relative;padding-top:20px}
.blocks{display:flex;flex-direction:column}
.blk{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.blk .n{font-family:var(--mono);font-size:13px;color:var(--faint);width:22px;padding-top:2px}
.blk .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.blk .t b{font-size:17px}
.blk .t span{font-size:13px;color:var(--muted)}
.blk .m{font-family:var(--mono);font-size:13px;color:var(--muted)}
.cta{height:60px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;padding:0 24px;width:100%}
.cta svg{stroke:var(--btn-ink)}
.cta.accent{background:var(--accent);color:var(--accent-ink)}
.cta.accent svg{stroke:var(--accent-ink)}
.ghostbtn{height:48px;border-radius:999px;border:1.5px solid var(--rule);font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.done{color:var(--accent)}
.card{background:var(--surface);border-radius:18px;padding:14px 16px}
.stat{font-family:var(--display);font-weight:500;font-size:30px;line-height:1}
.stat small{font-size:15px}
.delta{font-size:12px;color:var(--accent)}
.empty{border:1.5px dashed var(--rule);border-radius:18px;padding:18px;color:var(--muted);line-height:1.45}
.empty b{color:var(--ink)}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--rule);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--faint);min-height:48px}
.nav button svg{stroke:currentColor}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:var(--accent)}
/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-weight:700}
.row .t span{font-size:13px;color:var(--muted)}
.row svg.chev{stroke:var(--faint);flex:none}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);flex:none}
.tag.warn{color:var(--warn)}
.tag.next{background:var(--accent);color:var(--accent-ink)}
/* pantallas completas y hojas */
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.ov .in{max-width:480px;margin:0 auto;padding:16px 20px calc(150px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;gap:16px;position:relative}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 4px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{stroke:var(--ink)}
.iconbtn svg[stroke="currentColor"]{stroke:currentColor}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface);padding:0 12px;width:100%}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
/* sesión */
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--seg1)}
.dots i.d{background:var(--accent)}
.dots i.c{background:var(--ink)}
.silbox{background:var(--surface);border-radius:24px;height:230px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.silbox svg.sil{width:100%;max-width:330px;height:210px}
.sil .sg{stroke:var(--seg1);stroke-width:7;stroke-linecap:round}
.sil .sgh{fill:var(--seg1)}
.sil .ss{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.sil .ssh{fill:var(--ink)}
.sil .st{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round;fill:none}
.sil .sp{stroke:var(--seg2);stroke-width:4;stroke-linecap:round}
.silbox .hint{position:absolute;bottom:12px;right:14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.silbox .bl{position:absolute;top:12px;left:14px}
.warnline{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--warn);background:var(--surface);border-radius:14px;padding:10px 12px}
.warnline svg{stroke:var(--warn);flex:none;margin-top:1px}
.sets{display:flex;flex-direction:column}
.sethead,.setrow{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 60px 44px;gap:8px;align-items:center}
.sethead{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);padding-bottom:6px}
.setrow{min-height:54px;border-top:1px solid var(--rule)}
.setrow .sn{font-family:var(--display);font-weight:600;font-size:18px}
.setrow.done .sn{color:var(--accent)}
.setrow .pv{font-family:var(--mono);font-size:12px;color:var(--faint)}
.setrow input{height:38px;width:100%;border-radius:10px;border:0;background:var(--surface);text-align:center;font-family:var(--display);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.setrow.done input{background:transparent}
.setrow.time{grid-template-columns:44px minmax(0,1fr) 110px 44px}
.tick{width:42px;height:42px;border-radius:999px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center}
.tick svg{stroke:var(--faint)}
.setrow.done .tick{background:var(--accent);border-color:var(--accent)}
.setrow.done .tick svg{stroke:var(--accent-ink)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{stroke:var(--accent-ink)}
.tick svg path{stroke-dasharray:30;stroke-dashoffset:0}
.setrow.just .tick svg path{animation:firma .45s ease-out}
@keyframes firma{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.holdbtn{height:38px;border-radius:999px;background:var(--chip);font-family:var(--mono);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.holdbtn.run{background:var(--ink);color:var(--bg)}
.sfoot{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sfoot .in2{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.timer{background:var(--btn);color:var(--btn-ink);border-radius:26px;padding:12px 10px 12px 20px;display:flex;flex-direction:column;gap:6px}
.timer .r{display:flex;align-items:center;gap:12px}
.timer .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;opacity:.7}
.timer .tv{font-family:var(--display);font-weight:500;font-size:26px;line-height:1}
.timer .skip{height:44px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.timer svg{width:100%;height:22px}
.timer .tb{stroke:var(--seg2);opacity:.45;stroke-width:4;fill:none;stroke-linecap:round}
.timer .tf{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}
.navbtns{display:flex;gap:10px}
.navbtns .ghostbtn{background:var(--surface);border:0;height:56px;min-width:56px}
.navbtns .cta{flex:1;height:56px;font-size:19px}
/* transición */
.trans{position:fixed;inset:0;z-index:12;background:var(--bg);overflow:hidden}
.trans svg{position:absolute;inset:0;width:100%;height:100%}
.trans path{stroke:var(--accent);fill:none;stroke-width:420;stroke-linecap:round;stroke-dasharray:100 100;animation:barrido 1.4s cubic-bezier(.6,0,.3,1) forwards}
@keyframes barrido{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.trans .txt{position:absolute;left:24px;right:24px;bottom:calc(140px + env(safe-area-inset-bottom,0px));color:var(--accent-ink);display:flex;flex-direction:column;gap:10px;animation:aparece 1.6s ease forwards}
@keyframes aparece{0%,55%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
.trans .txt h1{margin:0;font-family:var(--display);font-weight:600;font-size:64px;line-height:.92;text-transform:uppercase}
.trans .txt p{margin:0;font-size:16px;line-height:1.4}
.trans .go{position:absolute;left:24px;right:24px;bottom:calc(40px + env(safe-area-inset-bottom,0px));background:var(--accent-ink);color:var(--accent)}
.trans .go svg{stroke:var(--accent)}
/* tarjeta */
.daycard{background:var(--surface);border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:4px;border-radius:2px}
.cardimg{width:100%;border-radius:20px;display:block}
/* gráficas */
.ch{width:100%;height:auto;display:block}
.ch .gl{stroke:var(--rule);stroke-width:1}
.ch .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linecap:round}
.ch .ar{fill:var(--accent);opacity:.1}
.ch .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.ch .end{fill:var(--accent)}
.ch text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.wk path.a{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.wk path.b{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:2 6;opacity:.6}
.wk .on{fill:var(--accent)} .wk .off{fill:var(--faint)} .wk .today{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.wk text{font-family:var(--mono);font-size:11px;fill:var(--faint)} .wk text.h{fill:var(--accent)}
.seg path{fill:none;stroke-width:5;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:90%;text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:14px}
.danger{color:var(--warn);font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fmtD=s=>{const d=parseISO(s);return d.getDate()+' '+MES[d.getMonth()]};
const fmtNum=n=>(n==null||n==='')?'—':String(Math.round(n*10)/10).replace('.',',');
const parseNum=v=>{if(v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const weekStart=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x};
function smooth(p){if(!p.length)return'';let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=' C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+' '+(b[1]+(c[1]-a[1])/6).toFixed(1)+','+(c[0]-(e[0]-b[0])/6).toFixed(1)+' '+(c[1]-(e[1]-b[1])/6).toFixed(1)+','+c[0].toFixed(1)+' '+c[1].toFixed(1)}return d}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2400)}

const I={
  arrow:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  tick:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path pathLength="30" d="M4 12.5 C 6 13.5, 8 16, 9.5 17.5 C 12 13, 16 8, 21 5.5"/></svg>',
  play:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
  warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
  brand:'<svg width="30" height="18" viewBox="0 0 30 18" fill="none" aria-hidden="true"><path d="M2 14 C 8 2, 14 16, 20 6 S 27 2, 28 4" stroke-width="2.4" stroke-linecap="round"/></svg>',
  hoy:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 16 C 7 6, 11 18, 15 9 S 20 5, 21 6"/></svg>',
  rut:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',

const CFG=window.TRAZO_CONFIG||{};
const cloud={sb:null,session:null,writing:false,again:false,dirty:false,timer:null,last:0,state:'local'};
const SYNC_TXT={local:'Solo en este celular',nologin:'Sin iniciar sesión: solo en este celular',syncing:'Sincronizando…',ok:'Guardado en la nube',offline:'Sin internet: se sube al volver',error:'No se pudo guardar en la nube'};
function setSync(k){cloud.state=k;document.querySelectorAll('[data-sync]').forEach(el=>el.textContent=SYNC_TXT[k]||k)}
const cloudReady=()=>!!(cloud.sb&&cloud.session);
const netDown=err=>navigator.onLine===false||/fetch|network|load failed/i.test(String((err&&err.message)||err||''));
async function push(){
  if(!cloudReady()){setSync(cloud.sb?'nologin':'local');return}
  if(cloud.writing){cloud.again=true;return}
  cloud.writing=true;setSync('syncing');let error=null;
  try{({error}=await cloud.sb.from('trazo_state').upsert({user_id:cloud.session.user.id,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()}))}catch(e){error=e}
  cloud.writing=false;
  if(error)setSync(netDown(error)?'offline':'error');else{cloud.dirty=false;cloud.last=Date.now();setSync('ok')}
  if(cloud.again){cloud.again=false;push()}
}
/* Si la nube es más nueva, se adopta; si este celular es más nuevo, se sube. Mientras hay una sesión de entrenamiento abierta no se reemplaza nada: al terminar, gana lo de este celular. */
async function pull(){
  if(!cloudReady()||cloud.writing)return;
  setSync('syncing');let data=null,error=null;
  try{({data,error}=await cloud.sb.from('trazo_state').select('data').eq('user_id',cloud.session.user.id).maybeSingle())}catch(e){error=e}
  if(error){setSync(netDown(error)?'offline':'error');return}
  const remote=data&&data.data;
  if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)&&!stack.includes('session')){
    const d=migrate(JSON.parse(JSON.stringify(remote)));
    if(d){S=d;persist();cloud.dirty=false;cloud.last=Date.now();setSync('ok');if(!stack.length)render();else if(sheetState&&sheetState.kind==='account')rerenderSheet();return}
  }
  if(!remote||(S.updatedAt||0)>(remote.updatedAt||0)||stack.includes('session')){if(!S.updatedAt)S.updatedAt=Date.now();persist();await push();return}
  cloud.dirty=false;cloud.last=Date.now();setSync('ok');
}
async function initCloud(){
  const make=window.supabase&&window.supabase.createClient;
  if(!CFG.url||!CFG.key||!make){setSync('local');return}
  try{
    cloud.sb=make(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'trazo-auth'}});
    const {data}=await cloud.sb.auth.getSession();cloud.session=(data&&data.session)||null;
    cloud.sb.auth.onAuthStateChange((ev,s)=>{cloud.session=s||null;if(ev==='SIGNED_IN')setTimeout(pull,0);if(ev==='SIGNED_OUT'){setSync('nologin');setTimeout(()=>{if(!stack.length)render()},0)}});
    if(cloud.session)await pull();else setSync('nologin');
    if(!stack.length)render();
  }catch(e){cloud.sb=null;cloud.session=null;setSync('local')}
}

  if(m.includes('not confirmed'))return 'Falta confirmar el correo: abre el link que te llegó y luego dale Entrar.';

}

function buildDraft(d){
  const steps=[];['cal','est','fue'].forEach(b=>d[b].forEach(id=>exOf(id)&&steps.push({t:b,id})));
  const log={};[...d.cal,...d.est,...d.fue].forEach(id=>{const e=exOf(id);if(!e)return;const n=e.sets*(e.side?2:1);const last=e.block==='fue'?lastSetsFor(id):null;const sg=e.block==='fue'?suggest(e,S.dance===iso()):null;
    log[id]={sets:Array.from({length:n},(_,k)=>{const lp=last&&last[Math.min(k,last.length-1)];return {kg:null,reps:null,done:false,ph:sg?sg.kg:(lp&&lp.kg!=null?lp.kg:null),prev:lp?lp:null}})}});
  return {dayId:d.id,start:Date.now(),step:0,steps,log,trans:false,transShown:false,prefer:S.prefer||null,danced:S.dance===iso()};
}

}

  if(!T)return;const left=(T.end-Date.now())/1000;const tv=document.getElementById('tv'),tf=document.getElementById('tf');
  if(tv)tv.textContent=mmss(left);if(tf)tf.setAttribute('stroke-dasharray',(Math.min(100,Math.max(0,(1-left/T.total)*100))).toFixed(1)+' 100');
  const hb=document.getElementById('hold_'+T.id+'_'+T.k);if(hb)hb.innerHTML=mmss(left);
  if(left<=0){const t=T;stopTimer();beep();if(t.kind==='hold'){const s=S.draft&&S.draft.log[t.id]&&S.draft.log[t.id].sets[t.k];if(s){s.done=true;s.secs=t.total;justDone=t.id+'_'+t.k;save()}}renderSession()}
}

  daypick:el=>{const d=S.days[sheetState.i];d[sheetState.adding].push(el.dataset.v);save();rerenderSheet();render()},
  daymv:el=>{const d=S.days[sheetState.i],b=el.dataset.b,k=Number(el.dataset.k),j=k+Number(el.dataset.d);if(j<0||j>=d[b].length)return;[d[b][k],d[b][j]]=[d[b][j],d[b][k]];save();rerenderSheet()},
  dayrm:el=>{const d=S.days[sheetState.i];d[el.dataset.b].splice(Number(el.dataset.k),1);save();rerenderSheet();render()},
  copyblocks:()=>{const d=S.days[sheetState.i];S.days.forEach(x=>{x.cal=d.cal.slice();x.est=d.est.slice()});save();toast('Calentamiento y estiramiento copiados a todos los días');render()},
  setnext:()=>{const d=S.days[sheetState.i];if(d.plan==='duvan')S.sel=d.id;else{S.next=myDays().indexOf(d);S.sel=null}save();rerenderSheet();render();toast(d.plan==='duvan'?d.name+' es el de hoy':d.name+' es el siguiente')},
  delday:()=>{const i=sheetState.i;const d=S.days[i];const mi=myDays().indexOf(d);S.days.splice(i,1);if(mi>=0&&S.next>mi)S.next--;if(S.sel===d.id)S.sel=null;save();closeTop();render()},
  askconfirm:()=>{sheetState.confirm=true;rerenderSheet()},
  noconfirm:()=>{sheetState.confirm=false;rerenderSheet()},
  newex:el=>{const b=el.dataset.v||'fue';const back=sheetState&&sheetState.kind==='day'?{kind:'day',i:sheetState.i,adding:b}:null;const e={id:'x'+uid(),name:'',block:b,kind:'reps',sets:3,target:b==='fue'?'10':'8',side:false,rest:b==='fue'?S.settings.rest:30,tip:'',sil:b==='est'?'pliegue':b==='cal'?'movilidad':'empuje',flag:false};
    if(sheetState){sheetState={kind:'ex',e,isNew:true,back};rerenderSheet()}else showSheet({kind:'ex',e,isNew:true,back})},
  editex:el=>showSheet({kind:'ex',e:Object.assign({},S.ex[el.dataset.v]),isNew:false}),
  saveex:()=>{const e=sheetState.e;if(!e.name.trim()){toast('Ponle un nombre al ejercicio');document.getElementById('ename').focus();return}
    e.sets=Math.max(1,parseInt(e.sets)||1);e.rest=Math.max(0,parseInt(e.rest)||0);if(e.kind==='time')e.target=Math.max(5,parseInt(e.target)||45);else e.target=String(e.target||'10').trim();
    const old=S.ex[e.id];if(old&&old.block!==e.block)S.days.forEach(d=>{d[old.block]=d[old.block].filter(x=>x!==e.id)});
    S.ex[e.id]=e;const back=sheetState.back;if(back){const d=S.days[back.i];if(d&&!d[e.block].includes(e.id))d[e.block].push(e.id)}save();render();
    if(back){sheetState={kind:'day',i:back.i};rerenderSheet()}else closeTop();toast('Guardado')},
  delex:()=>{const id=sheetState.e.id;delete S.ex[id];S.days.forEach(d=>['cal','est','fue'].forEach(b=>d[b]=d[b].filter(x=>x!==id)));save();closeTop();render()},
  measure:el=>{const id=el.dataset.v;const m=id?S.measures.find(x=>x.id===id):null;showSheet({kind:'measure',isNew:!m,m:m?{id:m.id,date:m.date,v:Object.assign({},m.v)}:{id:uid(),date:iso(),v:{}}})},
  savemeasure:()=>{const m=sheetState.m;Object.keys(m.v).forEach(k=>{if(m.v[k]==null)delete m.v[k]});if(!Object.keys(m.v).length){toast('Llena al menos una medida');return}
    const i=S.measures.findIndex(x=>x.id===m.id);if(i>=0)S.measures[i]=m;else S.measures.push(m);save();closeTop();render();toast('Medidas guardadas')},
  delmeasure:()=>{S.measures=S.measures.filter(x=>x.id!==sheetState.m.id);save();closeTop();render()},
  edittests:()=>{sheetState.editTests=true;rerenderSheet()},
  donetests:()=>{S.flexTests=S.flexTests.filter(t=>t.name.trim());save();sheetState.editTests=false;rerenderSheet();render()},
  addtest:()=>{S.flexTests.push({id:'t'+uid(),name:'Nueva prueba',unit:'cm',better:'up',hint:''});save();rerenderSheet()},
  deltest:el=>{S.flexTests.splice(Number(el.dataset.v),1);save();rerenderSheet()},
  sessinfo:el=>showSheet({kind:'sess',id:el.dataset.v}),
  delsession:()=>{S.sessions=S.sessions.filter(x=>x.id!==sheetState.id);S.sessions.forEach((s,i)=>s.n=i+1);save();closeTop();render()},
  backup:()=>showSheet({kind:'backup'}),
  copybackup:()=>{const ta=document.getElementById('bout');const done=()=>toast('Copiado');try{navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();toast('Selecciónalo y cópialo')})}catch(e){ta.select();toast('Selecciónalo y cópialo')}},
  askrestore:()=>{const v=document.getElementById('bin').value.trim();if(!v){toast('Pega primero el texto de una copia');return}sheetState.pending=v;sheetState.confirm=true;rerenderSheet();document.getElementById('bin').value=v},
  restore:()=>{try{const d=migrate(JSON.parse(sheetState.pending));if(!d||!d.ex||!d.days)throw 0;S=d;S.draft=null;save();closeTop();render();toast('Datos restaurados')}catch(e){toast('Ese texto no es una copia válida de Trazo');sheetState.confirm=false;rerenderSheet()}},
  account:()=>{if(sheetState){sheetState={kind:'account'};rerenderSheet()}else showSheet({kind:'account'})},
  signin:async()=>{const email=(document.getElementById('lemail').value||'').trim(),password=document.getElementById('lpass').value||'';const msg=t=>{const m=document.getElementById('lmsg');if(m)m.textContent=t};
    if(!email||!password){msg('Escribe tu correo y tu contraseña.');return}msg('Entrando…');
    try{const r=await cloud.sb.auth.signInWithPassword({email,password});if(r.error){msg(authErr(r.error));return}cloud.session=r.data.session;closeTop();render();toast('Listo. Ahora tus datos se guardan en la nube');setTimeout(pull,0)}catch(e){msg(navigator.onLine===false?'Sin internet. Intenta cuando tengas conexión.':'No se pudo conectar. Intenta de nuevo.')}},
  syncnow:async()=>{await (cloud.dirty?push():pull());rerenderSheet()},
  signout:async()=>{try{await cloud.sb.auth.signOut()}catch(e){}cloud.session=null;setSync('nologin');closeTop();render();toast('Sesión cerrada')},
  aicopy:()=>{const t=aiText();const fb=()=>showSheet({kind:'ai',text:t});try{navigator.clipboard.writeText(t).then(()=>toast('Copiado. Pégalo en tu proyecto de Claude')).catch(fb)}catch(e){fb()}},
  closesheet:()=>closeTop(),
  scrim:(el,ev)=>{if(ev.target===el)closeTop()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.dataset.a!=='scrim')ev.stopPropagation();f(el,ev)}});
document.addEventListener('input',ev=>{
  const el=ev.target,k=el.dataset.in;if(!k)return;
  if(k==='kg'||k==='reps'){const s=S.draft.log[el.dataset.id].sets[Number(el.dataset.k)];const n=parseNum(el.value);s[k]=k==='reps'&&n!=null?Math.round(n):n;save();return}
  if(k==='goal'){S.settings.goal=Math.min(7,Math.max(1,parseInt(el.value)||S.settings.goal));save();return}
  if(k==='rest'){S.settings.rest=Math.max(0,parseInt(el.value)||S.settings.rest);save();return}
  if(k==='dname'||k==='dfocus'){S.days[sheetState.i][k==='dname'?'name':'focus']=el.value;save();render();return}
  if(k.startsWith('e.')){const f=k.slice(2);sheetState.e[f]=el.type==='checkbox'?el.checked:el.value;if(f==='kind'){sheetState.e.target=el.value==='time'?45:'10';rerenderSheet()}if(f==='sil')rerenderSheet();return}
  if(k==='mv'){sheetState.m.v[el.dataset.k]=parseNum(el.value);return}
  if(k==='mdate'){if(el.value)sheetState.m.date=el.value;return}
  if(k==='tname'||k==='tunit'||k==='thint'||k==='tbetter'){const t=S.flexTests[Number(el.dataset.i)];t[{tname:'name',tunit:'unit',thint:'hint',tbetter:'better'}[k]]=el.value;save();return}
  if(k==='progex'){progEx=el.value;render();return}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.type==='checkbox'&&el.dataset.in&&el.dataset.in.startsWith('e.')&&sheetState&&sheetState.e)sheetState.e[el.dataset.in.slice(2)]=el.checked});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(T)tick();if(stack.includes('session')&&navigator.wakeLock&&!wakeLock){try{navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{})}catch(e){}}}});

render();
initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
